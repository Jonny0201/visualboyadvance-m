name: CoreAudio 修正 · 驗證提交簽章

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation
          persist-credentials: false
          sparse-checkout: .github/vba-arm64
      - name: 建立符合規範的 GPG 簽署提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/vba-arm64/sign_fix_commit.py
